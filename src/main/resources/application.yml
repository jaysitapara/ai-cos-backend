spring:
  application:
    name: app-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jay-test-db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  error:
    include-message: never
    include-stacktrace: never

# Sourced from backend/.env (see .env.example). JWT_SECRET has no default on
# purpose: the application must not start with a hardcoded signing key.
jwt:
  secret: ${JWT_SECRET}
  # Access tokens are short lived by design: they are bearer credentials that
  # cannot be revoked before they expire. Sessions are kept alive by the
  # rotating refresh token instead, which can be revoked at any time.
  expiration: ${JWT_EXPIRATION:900000}

app:
  cors:
    # Vite dev server (3000) plus Vite's own default port (5173).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  auth:
    max-failed-login-attempts: ${AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
    lock-duration-minutes: ${AUTH_LOCK_DURATION_MINUTES:15}
    refresh-token-validity-days: ${AUTH_REFRESH_TOKEN_VALIDITY_DAYS:30}
    verification-token-hours: ${AUTH_VERIFICATION_TOKEN_HOURS:24}
    password-reset-token-hours: ${AUTH_PASSWORD_RESET_TOKEN_HOURS:2}
    login-history-retention-days: ${AUTH_LOGIN_HISTORY_RETENTION_DAYS:90}
    # Per-IP budget on credential endpoints, on top of the per-account lockout.
    rate-limit-max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:20}
    rate-limit-window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
    cleanup-cron: ${AUTH_CLEANUP_CRON:0 30 3 * * *}

  oauth:
    google:
      # Blank by default so the app boots without Google credentials; the
      # /v1/auth/google endpoint then reports itself as unconfigured.
      client-id: ${GOOGLE_CLIENT_ID:}
      jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      issuers: ${GOOGLE_ISSUERS:https://accounts.google.com,accounts.google.com}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.app: INFO
