spring:
  application:
    name: app-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jay-test-db}}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgrespassword}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:30}
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 500
      min-spare: 50
    max-connections: 10000
    accept-count: 2000
    connection-timeout: 20000
  error:
    include-message: never
    include-stacktrace: never

# Centralized environment variable properties
ai:
  mode: ${AI_MODE:gemini}

gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-1.5-flash}

openai:
  api-key: ${OPENAI_API_KEY:}

tavily:
  api-key: ${TAVILY_API_KEY:}

upstash:
  redis:
    rest-url: ${UPSTASH_REDIS_REST_URL:}
    rest-token: ${UPSTASH_REDIS_REST_TOKEN:}

jwt:
  secret: ${JWT_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET:${JWT_SECRET}}
  expiration: ${JWT_EXPIRATION:900000}

github:
  token: ${GITHUB_TOKEN:}

vercel:
  token: ${VERCEL_TOKEN:}

resend:
  api-key: ${RESEND_API_KEY:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

  auth:
    max-failed-login-attempts: ${AUTH_MAX_FAILED_LOGIN_ATTEMPTS:5}
    lock-duration-minutes: ${AUTH_LOCK_DURATION_MINUTES:15}
    refresh-token-validity-days: ${AUTH_REFRESH_TOKEN_VALIDITY_DAYS:30}
    verification-token-hours: ${AUTH_VERIFICATION_TOKEN_HOURS:24}
    password-reset-token-hours: ${AUTH_PASSWORD_RESET_TOKEN_HOURS:2}
    login-history-retention-days: ${AUTH_LOGIN_HISTORY_RETENTION_DAYS:90}
    rate-limit-max-attempts: ${AUTH_RATE_LIMIT_MAX_ATTEMPTS:20}
    rate-limit-window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
    cleanup-cron: ${AUTH_CLEANUP_CRON:0 30 3 * * *}

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
      issuers: ${GOOGLE_ISSUERS:https://accounts.google.com,accounts.google.com}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.app: INFO
