spring:
  datasource:
    url: jdbc:h2:mem:app_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  data:
    redis:
      url: redis://localhost:6379
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

ai:
  mode: gemini

gemini:
  api-key: test-gemini-key

openai:
  api-key: test-openai-key

tavily:
  api-key: test-tavily-key

upstash:
  redis:
    rest-url: https://test-upstash.io
    rest-token: test-upstash-token

jwt:
  secret: test-secret-key-used-only-for-automated-tests-0123456789
  refresh-secret: test-refresh-secret-key-used-only-for-automated-tests
  expiration: 3600000

github:
  token: test-github-token

vercel:
  token: test-vercel-token

resend:
  api-key: test-resend-api-key

app:
  cors:
    allowed-origins: http://localhost:3000

  auth:
    max-failed-login-attempts: 5
    lock-duration-minutes: 15
    refresh-token-validity-days: 30
    verification-token-hours: 24
    password-reset-token-hours: 2
    login-history-retention-days: 90
    rate-limit-max-attempts: 1000
    rate-limit-window-seconds: 60
    cleanup-cron: "0 0 0 1 1 ?"

  oauth:
    google:
      client-id: ''
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      issuers: https://accounts.google.com,accounts.google.com
