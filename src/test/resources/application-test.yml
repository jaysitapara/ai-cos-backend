# Test profile: an in-memory H2 database keeps the build runnable on any
# machine (and in CI) without PostgreSQL or Docker. Integration tests that must
# exercise real PostgreSQL behaviour should use Testcontainers instead.
spring:
  datasource:
    url: jdbc:h2:mem:app_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

jwt:
  secret: test-secret-key-used-only-for-automated-tests-0123456789
  expiration: 3600000

app:
  cors:
    allowed-origins: http://localhost:3000
