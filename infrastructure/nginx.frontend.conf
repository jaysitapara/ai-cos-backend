# Nginx configuration for the single-page frontend.
#
# The client owns its routing: paths such as /app/workspace exist only inside
# the JavaScript bundle, and nginx has no file to serve for them. Without the
# try_files fallback below, opening a deep link or simply refreshing any page
# other than the root returns a 404 — the application works while navigating
# and breaks on reload, which is the classic SPA deployment failure.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Hashed asset filenames are immutable, so they can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it carries the references to the current
    # asset hashes, and a stale copy pins returning users to a deleted build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Serve a real file when one exists; otherwise hand the URL to the SPA and
    # let the client router resolve it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
